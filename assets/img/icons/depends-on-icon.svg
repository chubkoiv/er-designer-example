<svg height="16" viewBox="0 0 16 16" width="16" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<style>.a, .b {
			fill: none;
		}

		.a {
			stroke: #8095b3;
			stroke-miterlimit: 10;
		}

		.c {
			fill: #8095b3;
		}

		.d {
			stroke: none;
		}</style>
	</defs>
	<g class="a" transform="translate(4 1)">
		<rect class="d" height="11" rx="1" width="12"/>
		<rect class="b" height="10" rx="0.5" width="11" x="0.5" y="0.5"/>
	</g>
	<rect class="b" height="16" transform="translate(16 16) rotate(180)" width="16"/>
	<line class="a" transform="translate(4.5 4.5)" x2="11"/>
	<rect class="c" height="10" rx="1" transform="translate(0 6)" width="12"/>
</svg>
